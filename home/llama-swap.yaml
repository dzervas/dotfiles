# llama-swap configuration, mounted read-only straight from this repository.
#
# The container runs with `-watch-config`, which polls this file every 2s and
# reloads on change: edit here and the next model load picks it up, with no
# `nixos-rebuild` and no container restart. In-flight requests are drained and
# running models are stopped, so a reload costs one model load.
#
# Force a reload of a specific model without waiting for a request:
#   curl -X POST http://127.0.0.1:1337/upstream/ornith/unload
#   curl -sS http://127.0.0.1:1337/v1/models
#
# `cmd` is one command spread over several lines, not a shell script: the first
# line is the executable and every later line is an argument. Comment-only lines
# are stripped by llama-swap. There is no shell here, so no pipes, redirects or
# command substitution; quote any single argument that contains spaces.

healthCheckTimeout: 300
logToStdout: both

models:
  ornith:
    aliases:
      - ornith
    capabilities:
      context: 131072
      in:
        - text
      out:
        - text
      thinking: true
    cmd: |
      turboquant-server --host 127.0.0.1 --port ${PORT}
      --model /root/.cache/huggingface/hub/models--offmonreal--Ornith-1.5-35B-MaxQuality-MTP-GGUF/snapshots/33b1d387e9fca2bf07e0a949d3db25f4babc389f/Ornith-1.5-35B_Q4_K_M_imatrix_MTP.gguf

      # Agent/tool parsing. The GGUF's embedded template is used deliberately:
      # the third-party Qwen override produced worse tool formatting.
      --jinja
      --reasoning-format deepseek

      # Pi supplies a per-request token budget only when thinking is enabled.
      # Do not add a server-wide --reasoning-budget: it corrupts thinking-off
      # replies by injecting this message into ordinary output.
      --reasoning-budget-message '[Reasoning budget reached. Do not continue analysis outside the thinking block. Immediately make the best next tool call, preferably a focused test or code edit, or provide the final answer.]'

      --parallel 1

      # 35B-A3B MoE: expert tensors for layers 18-39 live on the CPU, everything
      # else stays resident. Peak measured at 15,294 MiB with ~545 MiB free.
      --fit off
      --n-gpu-layers 99
      --n-cpu-moe 0
      --override-tensor 'blk\.(1[89]|2[0-9]|3[0-9])\.ffn_.*_exps\.weight=CPU'
      --no-mmap

      --ctx-size 131072
      --flash-attn on
      # TurboQuant upgrades symmetric turbo K on this 8:1 GQA model anyway.
      --cache-type-k q8_0
      --cache-type-v turbo3

      # ubatch 512 avoids the long-prefill CUDA VMM OOM seen at ~65k tokens.
      --batch-size 32768
      --ubatch-size 512
      --threads 16
      --cache-reuse 256

      # Donor-MTP speculation. Measured 71% draft acceptance, but it showed no
      # reliability benefit on the long-horizon benchmark, no throughput win at
      # agent context lengths, and it OOMs when the desktop holds ~3.5 GiB.
      # --spec-type draft-mtp
      # --spec-draft-n-max 2

      --temp 0.6
      --top-k 20
      --top-p 0.95
      --min-p 0
      --presence-penalty 0
      --repeat-penalty 1.0

  qwen3:
    aliases:
      - qwen3.8
    capabilities:
      context: 98304
      # This server does not surface max_output_tokens in /v1/models, so the
      # per-model output budget lives in pi/extensions/llama-swap.ts instead.
      in:
        - text
      out:
        - text
      thinking: true
    cmd: |
      turboquant-server --host 127.0.0.1 --port ${PORT}
      # Qwen ships safetensors only (FP8 ~27 GB, NVFP4 ~21 GB of weights), so no
      # first-party artifact fits 16 GB. This is unsloth's vanilla quant of
      # Qwen/Qwen3.8-27B, not a fine-tune.
      --model /root/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-UD-IQ3_XXS.gguf

      --jinja
      --reasoning-format deepseek
      --parallel 1

      # Dense 27B: every layer runs on every token, so a single CPU-resident
      # layer collapses decode. Nothing may spill. The vision projector is
      # omitted on purpose (0.86 GiB) and so is the separate MTP head (1.28 GiB).
      --fit off
      --n-gpu-layers 99
      --no-mmap

      # Hybrid attention: only 16 of 64 layers hold a KV cache (4 KV heads,
      # head_dim 256), so q8_0 costs 34,816 B/token and 128k fits in 4.25 GiB.
      # The other 48 Gated DeltaNet layers hold a fixed 0.146 GiB state.
      # IQ3_S is ~1055 MiB larger than IQ3_XXS, so context pays for the quality.
      # IQ3_S at 65536 stopped loading once the desktop grew: it wants ~13.4 GiB
      # and only 12909 MiB were free, which killed two benchmark runs with
      # "upstream command exited prematurely". IQ3_XXS at 98304 loads with
      # 13226 MiB free and buys 50% more context, which matters more than the
      # quant step for long runs. 131072 with q8_0 V needs 4352 MiB and OOMed.
      --ctx-size 98304
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v turbo3

      --batch-size 32768
      --ubatch-size 512
      --threads 16
      --cache-reuse 256

      # Thinking-mode sampling from the official Qwen3.8 model card. For
      # non-thinking use the card recommends temp 0.7, top-p 0.8, presence 1.5.
      --temp 1.0
      --top-k 20
      --top-p 0.95
      --min-p 0
      --presence-penalty 0
      --repeat-penalty 1.0

  ornith9:
    aliases:
      - ornith-9b
    capabilities:
      context: 131072
      in:
        - text
      out:
        - text
      thinking: true
    cmd: |
      turboquant-server --host 127.0.0.1 --port ${PORT}
      # First-party GGUF. 9B dense with hybrid attention: only 8 of 32 layers
      # hold a KV cache, so Q8_0 weights and a 131072 cache fit together.
      --model /root/.cache/huggingface/hub/models--ornith-ai--Ornith-1.5-9B-GGUF/snapshots/abdd624b12ebf020b767fff532ff44fe552b28c3/Ornith-1.5-9B-Q8_0.gguf

      --jinja
      --reasoning-format deepseek
      --parallel 1

      # Weights 9.114 GiB + q8_0 KV at 131072 (2.13 GiB) = 11.24 GiB of ~13.6.
      # Nothing is offloaded and the vision projector is not loaded.
      --fit off
      --n-gpu-layers 99
      --no-mmap

      # 8 full-attention layers x 4 KV heads x 256 head_dim x (K+V):
      # 32768 B/token at fp16, 17408 B/token at q8_0. Deliberately not turbo3:
      # at this size VRAM is not scarce, so avoid the fork-specific KV format.
      --ctx-size 131072
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0

      --batch-size 32768
      --ubatch-size 512
      --threads 16
      --cache-reuse 256

      # Same official Ornith 1.5 sampling as the 35B.
      --temp 0.6
      --top-k 20
      --top-p 0.95
      --min-p 0
      --presence-penalty 0
      --repeat-penalty 1.0

  zeta-2.1:
    aliases:
      - zeta
    capabilities:
      context: 6144
      in:
        - text
      out:
        - text
    cmd: vllm serve --host 127.0.0.1 --port ${PORT} --config /vllm-zeta.yaml

# One model at a time on the single GPU: loading any member evicts the others.
routing:
  router:
    use: group
    settings:
      groups:
        gpu:
          swap: true
          exclusive: true
          members:
            - zeta
            - ornith
            - ornith9
            - qwen3

store:
  path: /data/llama-swap.sqlite
