# llama-swap configuration, mounted read-only straight from this repository.
#
# The container runs with `-watch-config`, which polls this file every 2s and
# reloads on change: edit here and the next model load picks it up, with no
# `nixos-rebuild` and no container restart. In-flight requests are drained and
# running models are stopped, so a reload costs one model load.
#
# Force a reload of a specific model without waiting for a request:
#   curl -X POST http://127.0.0.1:1337/upstream/ornith/unload
#   curl -sS http://127.0.0.1:1337/v1/models
#
# `cmd` is one command spread over several lines, not a shell script: the first
# line is the executable and every later line is an argument. Comment-only lines
# are stripped by llama-swap. There is no shell here, so no pipes, redirects or
# command substitution; quote any single argument that contains spaces.

healthCheckTimeout: 300
logToStdout: both

macros:
  qwen3_ctx: 100000
  qwen3_aggressive_ctx: 262000

models:
  qwen3: &qwen3
    capabilities:
      context: ${qwen3_ctx}
      in: [text]
      out: [text]
      thinking: true
    cmd: |
      llama-server --host 127.0.0.1 --port ${PORT}
      --ctx-size ${qwen3_ctx}
      --fit-ctx ${qwen3_ctx}
      --model /root/.cache/huggingface/hub/models--ISTA-DASLab--Qwen3.8-27B-GSQ-RCO-GGUF/snapshots/d562806dbafae37109975e970aae91b43e73b440/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf

      --parallel 1

      --fit on
      # --fit-target 6144
      # --n-gpu-layers 99
      # --no-mmap

      # --ctx-checkpoints 4
      # --checkpoint-min-step 8192

      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0

      # --batch-size 256
      # --ubatch-size 512
      --threads 16
      --cache-reuse 256

      # --spec-type draft-mtp
      # --spec-draft-n-max 2
      --reasoning-effort medium

      # Thinking-mode sampling from the official Qwen3.8 model card. For
      # non-thinking use the card recommends temp 0.7, top-p 0.8, presence 1.5.
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      # --repeat-penalty 1.0
  qwen3-thinkingcap:
    <<: *qwen3
    cmd: |
      llama-server --host 127.0.0.1 --port ${PORT}
      --ctx-size ${qwen3_ctx}
      --fit-ctx ${qwen3_ctx}
      --model /root/.cache/huggingface/hub/models--bottlecapai--ThinkingCap-Qwen3.8-27B-GGUF/snapshots/210a3fcc395c7663c611c7e3fe72f477265a6bce/ThinkingCap-Qwen3.8-27B-Q4_K_M.gguf

      --parallel 1

      --fit on
      # --fit-target 6144
      # --n-gpu-layers 99
      # --no-mmap

      # --ctx-checkpoints 4
      # --checkpoint-min-step 8192

      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0

      # --batch-size 256
      # --ubatch-size 512
      --threads 16
      --cache-reuse 256

      # --spec-type draft-mtp
      # --spec-draft-n-max 2
      --reasoning-effort medium

      # Thinking-mode sampling from the official Qwen3.8 model card. For
      # non-thinking use the card recommends temp 0.7, top-p 0.8, presence 1.5.
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      # --repeat-penalty 1.0

  qwen3-aggressive:
    <<: *qwen3
    cmd: |
      latest-server --host 127.0.0.1 --port ${PORT}

      --model /root/.cache/huggingface/hub/models--HauhauCS--Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/snapshots/993a5971fda8f30dd1b7eb2654792ba4415c7460/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf
      --spec-draft-model /root/.cache/huggingface/hub/models--HauhauCS--Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/snapshots/993a5971fda8f30dd1b7eb2654792ba4415c7460/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-FastMTP-32K.gguf
      --spec-draft-ngl all
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --spec-draft-p-min 0

      --ctx-size ${qwen3_aggressive_ctx}
      --fit-ctx ${qwen3_aggressive_ctx}
      --parallel 1

      --fit on

      --jinja
      --reasoning on
      --reasoning-effort medium
      --reasoning-preserve
      --reasoning-format deepseek

      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0

      --batch-size 2048
      --ubatch-size 512
      --threads 16
      --cache-reuse 256

      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      --repeat-penalty 1.0

  zeta-2.1:
    aliases:
      - zeta
    capabilities:
      context: 6144
      in:
        - text
      out:
        - text
    cmd: vllm serve --host 127.0.0.1 --port ${PORT} --config /vllm-zeta.yaml

# One model at a time on the single GPU: loading any member evicts the others.
globalTTL: 600
routing:
  router:
    use: group
    settings:
      groups:
        gpu:
          swap: true
          exclusive: true
          members:
            - zeta
            - qwen3
            - qwen3-thinkingcap

store:
  path: /data/llama-swap.sqlite
